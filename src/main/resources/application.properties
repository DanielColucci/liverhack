spring.application.name=liverhack

# Railway inyecta PORT; en local sigue usando 8082
server.port=${PORT:8082}

spring.datasource.url=jdbc:postgresql://liverhack-db.cx0ms8q4s1hv.us-east-2.rds.amazonaws.com:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=liverhack
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- Correo ----------
# Producción (Railway): Brevo por HTTPS. Definir BREVO_API_KEY y MAIL_FROM.
brevo.api-key=${BREVO_API_KEY:}
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
mail.from-name=${MAIL_FROM_NAME:Liverpool Talento}
app.base-url=${APP_BASE_URL:https://liverhack-production.up.railway.app}

# Local: Gmail por SMTP (solo se usa si BREVO_API_KEY está vacío).
# Credenciales por variable de entorno, NO en el repo.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
